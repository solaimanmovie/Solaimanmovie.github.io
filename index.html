<!doctype html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>মুভি ঘর</title>
<style>
:root{--bg:#0f1117;--card:#1b1e29;--tx:#f2f3f7;--mu:#9aa0b4;--ac:#e5484d;--bd:#2a2e3d}
@media (prefers-color-scheme:light){:root{--bg:#f5f6fa;--card:#fff;--tx:#14161f;--mu:#626a80;--bd:#e1e4ee}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans Bengali","Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 14px;border-bottom:1px solid var(--bd)}
h1{margin:0;font-size:20px}h1 span{color:var(--ac)}
input,select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:15px}
.row{display:flex;gap:8px;margin-top:10px}.row>*{flex:1}.row select{flex:0 0 40%}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px}
.chip{flex:0 0 auto;padding:7px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:14px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
main{padding:14px;max-width:1000px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:620px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;cursor:pointer;text-align:left;color:inherit;padding:0;font:inherit}
.poster{aspect-ratio:2/3;width:100%;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700;color:#fff;background:linear-gradient(135deg,#e5484d,#6b3fa0)}
.card .t{padding:8px 10px 10px}.card b{display:block;font-size:14px;line-height:1.3}.card small{color:var(--mu)}
.btn{display:inline-block;padding:11px 16px;border-radius:10px;border:0;background:var(--ac);color:#fff;font:inherit;font-weight:600;text-decoration:none;text-align:center}
.btn.alt{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.empty{text-align:center;color:var(--mu);padding:50px 10px}
#modal{position:fixed;inset:0;z-index:20;display:none;background:rgba(0,0,0,.7);overflow-y:auto}
#modal.open{display:block}
.sheet{background:var(--bg);max-width:560px;margin:0 auto;min-height:100%;padding:14px 14px 24px}
.sheet .poster{max-height:420px;border-radius:12px}
video,iframe{width:100%;border-radius:12px;background:#000;margin-top:10px;border:0}
iframe{aspect-ratio:16/9}
.meta{color:var(--mu);margin:8px 0}.acts{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.acts>*{flex:1;min-width:130px}
.x{float:right;background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:99px;width:38px;height:38px;font-size:18px}
</style></head><body>
<header>
 <h1>🎬 মুভি <span>ঘর</span></h1>
 <div class="row"><input id="q" type="search" placeholder="মুভি খুঁজুন…"><select id="sort"><option value="new">নতুন আগে</option><option value="old">পুরোনো আগে</option><option value="az">নাম (অ-হ)</option><option value="yr">সাল অনুযায়ী</option></select></div>
 <div class="chips" id="chips"></div>
</header>
<main><div id="app"></div></main>
<div id="modal"></div>
<script src="movies.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const movies=(typeof MOVIES!=='undefined'?MOVIES:[]).map((m,i)=>({...m,id:String(i)}));
let q='',cat='সব',sort='new';
function gd(u){if(!/drive\.google\.com/.test(u||''))return null;const m=u.match(/\/d\/([^\/?]+)/)||u.match(/[?&]id=([^&]+)/);return m&&m[1]}
const yt=u=>{const x=(u||'').match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/);return x&&x[1]};
const direct=u=>/\.(mp4|webm|ogg)(\?|$)/i.test(u||'');
const dlUrl=m=>m.dl||(gd(m.video)?`https://drive.google.com/uc?export=download&id=${gd(m.video)}`:m.video);
const poster=(m,c='poster')=>m.poster?`<img class="${c}" src="${esc(m.poster)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=&quot;${c}&quot;>${esc((m.title||'?')[0])}</div>'">`:`<div class="${c}">${esc((m.title||'?')[0])}</div>`;
function render(){
  const cats=['সব',...new Set(movies.map(m=>m.cat).filter(Boolean))];
  $('#chips').innerHTML=cats.map(c=>`<button class="chip ${c===cat?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  let r=movies.filter(m=>(cat==='সব'||m.cat===cat)&&(!q||(m.title+' '+m.cat+' '+m.year).toLowerCase().includes(q)));
  const d=m=>m.date||'';
  if(sort==='new')r.sort((a,b)=>d(b).localeCompare(d(a)));
  if(sort==='old')r.sort((a,b)=>d(a).localeCompare(d(b)));
  if(sort==='az')r.sort((a,b)=>a.title.localeCompare(b.title,'bn'));
  if(sort==='yr')r.sort((a,b)=>(+b.year||0)-(+a.year||0));
  $('#app').innerHTML=r.length?`<div class="grid">${r.map(m=>`<button class="card" data-id="${m.id}">${poster(m)}<div class="t"><b>${esc(m.title)}</b><small>${esc(m.year)} ${m.cat?'• '+esc(m.cat):''}</small></div></button>`).join('')}</div>`:`<div class="empty">কোনো মুভি পাওয়া যায়নি।</div>`;
}
function detail(id){
  const m=movies.find(x=>x.id===id);if(!m)return;
  $('#modal').innerHTML=`<div class="sheet"><button class="x" id="close">✕</button><div style="clear:both"></div>${poster(m)}<div id="player"></div>
  <h2 style="margin:14px 0 0">${esc(m.title)}</h2><div class="meta">${esc(m.year)} ${m.cat?'• '+esc(m.cat):''}</div>
  <p style="line-height:1.7">${esc(m.desc)}</p>
  ${m.trailer&&yt(m.trailer)?`<iframe src="https://www.youtube.com/embed/${yt(m.trailer)}" allowfullscreen></iframe>`:''}
  <div class="acts">${(m.where||[]).map(w=>`<a class="btn" target="_blank" rel="noopener" href="${esc(w.url)}">${esc(w.name)}</a>`).join('')}${m.video?`<button class="btn" id="play" data-id="${m.id}">▶ দেখুন</button>`:''}${m.video||m.dl?`<a class="btn alt" target="_blank" rel="noopener" href="${esc(dlUrl(m))}" download>⬇ ডাউনলোড</a>`:''}</div></div>`;
  $('#modal').classList.add('open');
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.id==='close'){$('#modal').classList.remove('open');$('#modal').innerHTML=''}
  else if(t.classList.contains('chip')){cat=t.dataset.c;render()}
  else if(t.classList.contains('card'))detail(t.dataset.id);
  else if(t.id==='play'){
    const m=movies.find(x=>x.id===t.dataset.id),g=gd(m.video);
    $('#player').innerHTML=g?`<iframe src="https://drive.google.com/file/d/${g}/preview" allow="autoplay; fullscreen" allowfullscreen></iframe>`:direct(m.video)?`<video controls playsinline autoplay src="${esc(m.video)}"></video>`:`<div class="meta"><a class="btn" target="_blank" rel="noopener" href="${esc(m.video)}">নতুন ট্যাবে খুলুন</a></div>`;
    $('#player').scrollIntoView({block:'center'});
  }
});
$('#q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();render()});
$('#sort').addEventListener('change',e=>{sort=e.target.value;render()});
render();
</script></body></html>
